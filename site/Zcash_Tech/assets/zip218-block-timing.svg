<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="ZIP 218 changes Zcash block spacing from 75 seconds to 25 seconds, tripling daily blocks from 1,152 to 3,456 while dividing the per-block subsidy by three from 1.5625 to 0.52083333 ZEC, so daily issuance stays at 1,800 ZEC and halving dates are unchanged.">
  <title>ZIP 218: three times the blocks, the same ZEC per day</title>
  <desc>A comparison of Zcash block timing before and after ZIP 218. Today, blocks arrive every 75 seconds, 1,152 per day, each paying 1.5625 ZEC. After NU7, blocks arrive every 25 seconds, 3,456 per day, each paying 0.52083333 ZEC. Both multiply out to 1,800 ZEC issued per day. The halving interval stretches from 1,680,000 to 5,040,000 blocks, which is 126,000,000 seconds in both cases, so halving dates do not move.</desc>

  <style>
    :root { color-scheme: light dark; }
    .panel { fill: #FFFFFF; }
    .ink { fill: #15181D; }
    .muted { fill: #656C7A; }
    .rule { stroke: #E3E6EB; }
    .axis { stroke: #B9C0CB; }
    .block { fill: #47607D; }
    .card { fill: #F6F7F9; stroke: #E3E6EB; }
    .zec { fill: #F4B728; }
    .zecink { fill: #7A5B0B; }
    .chip { fill: #FDF3DC; stroke: #E8C878; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .t-title { font-size: 26px; font-weight: 700; }
    .t-sub { font-size: 14px; }
    .t-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .t-lead { font-size: 18px; font-weight: 650; }
    .t-stat { font-size: 13px; }
    .t-chip { font-size: 13px; font-weight: 650; }
    .t-card-h { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
    .t-card-v { font-size: 17px; font-weight: 650; }
    .t-card-n { font-size: 12px; }
    .t-tick { font-size: 11px; }
    .t-foot { font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #14171C; }
      .ink { fill: #E9ECF1; }
      .muted { fill: #98A1B0; }
      .rule { stroke: #2A2F38; }
      .axis { stroke: #3C434F; }
      .block { fill: #7FA3C6; }
      .card { fill: #1B1F26; stroke: #2A2F38; }
      .zecink { fill: #F4B728; }
      .chip { fill: #2A2313; stroke: #6B551C; }
    }
  </style>

  <rect class="panel" x="0" y="0" width="1000" height="680" rx="10"/>

  <!-- Header -->
  <text class="ink t-title" x="40" y="52">Three times the blocks, the same ZEC</text>
  <text class="muted t-sub" x="40" y="78">ZIP 218 cuts block target spacing from 75s to 25s at NU7. Issuance per unit of wall-clock time does not change.</text>
  <line class="rule" x1="40" y1="98" x2="960" y2="98" stroke-width="1"/>

  <!-- ============ TODAY ============ -->
  <text class="muted t-eyebrow" x="40" y="134">TODAY</text>
  <text class="ink t-lead" x="40" y="160">75-second blocks</text>
  <text class="muted t-stat" x="40" y="182">1,152 blocks per day</text>
  <rect class="chip" x="40" y="196" width="178" height="28" rx="14" stroke-width="1"/>
  <text class="zecink t-chip" x="129" y="215" text-anchor="middle">1.5625 ZEC per block</text>

  <!-- timeline: 300 seconds, marks every 75s -->
  <line class="axis" x1="290" y1="200" x2="940" y2="200" stroke-width="1.5"/>
  <g class="block">
    <rect x="283" y="178" width="14" height="22" rx="3"/>
    <rect x="445" y="178" width="14" height="22" rx="3"/>
    <rect x="608" y="178" width="14" height="22" rx="3"/>
    <rect x="770" y="178" width="14" height="22" rx="3"/>
    <rect x="933" y="178" width="14" height="22" rx="3"/>
  </g>
  <text class="muted t-tick" x="290" y="218">0s</text>
  <text class="muted t-tick" x="940" y="218" text-anchor="end">300s</text>
  <text class="muted t-tick" x="615" y="164" text-anchor="middle">5 blocks in 5 minutes</text>

  <line class="rule" x1="40" y1="248" x2="960" y2="248" stroke-width="1"/>

  <!-- ============ AFTER ============ -->
  <text class="muted t-eyebrow" x="40" y="284">AFTER NU7</text>
  <text class="ink t-lead" x="40" y="310">25-second blocks</text>
  <text class="muted t-stat" x="40" y="332">3,456 blocks per day</text>
  <rect class="chip" x="40" y="346" width="210" height="28" rx="14" stroke-width="1"/>
  <text class="zecink t-chip" x="145" y="365" text-anchor="middle">0.52083333 ZEC per block</text>

  <!-- timeline: 300 seconds, marks every 25s -->
  <line class="axis" x1="290" y1="350" x2="940" y2="350" stroke-width="1.5"/>
  <g class="block">
    <rect x="283" y="328" width="14" height="22" rx="3"/>
    <rect x="337" y="328" width="14" height="22" rx="3"/>
    <rect x="391" y="328" width="14" height="22" rx="3"/>
    <rect x="445" y="328" width="14" height="22" rx="3"/>
    <rect x="499" y="328" width="14" height="22" rx="3"/>
    <rect x="554" y="328" width="14" height="22" rx="3"/>
    <rect x="608" y="328" width="14" height="22" rx="3"/>
    <rect x="662" y="328" width="14" height="22" rx="3"/>
    <rect x="716" y="328" width="14" height="22" rx="3"/>
    <rect x="770" y="328" width="14" height="22" rx="3"/>
    <rect x="825" y="328" width="14" height="22" rx="3"/>
    <rect x="879" y="328" width="14" height="22" rx="3"/>
    <rect x="933" y="328" width="14" height="22" rx="3"/>
  </g>
  <text class="muted t-tick" x="290" y="368">0s</text>
  <text class="muted t-tick" x="940" y="368" text-anchor="end">300s</text>
  <text class="muted t-tick" x="615" y="314" text-anchor="middle">13 blocks in the same 5 minutes</text>

  <line class="rule" x1="40" y1="398" x2="960" y2="398" stroke-width="1"/>

  <!-- ============ WHAT DOES NOT CHANGE ============ -->
  <text class="muted t-eyebrow" x="40" y="432">WHAT DOES NOT CHANGE</text>

  <!-- Card 1: daily issuance -->
  <rect class="card" x="40" y="448" width="292" height="162" rx="8" stroke-width="1"/>
  <text class="muted t-card-h" x="60" y="474">ZEC ISSUED PER DAY</text>
  <rect class="zec" x="60" y="492" width="110" height="18" rx="4"/>
  <rect class="zec" x="60" y="518" width="110" height="18" rx="4"/>
  <text class="ink t-card-v" x="182" y="506">1,800</text>
  <text class="ink t-card-v" x="182" y="532">1,800</text>
  <text class="muted t-card-n" x="60" y="560">1,152 × 1.5625 = 1,800</text>
  <text class="muted t-card-n" x="60" y="578">3,456 × 0.52083333 ≈ 1,800</text>
  <text class="muted t-card-n" x="60" y="596">The tripling and the division cancel.</text>

  <!-- Card 2: halving timing -->
  <rect class="card" x="354" y="448" width="292" height="162" rx="8" stroke-width="1"/>
  <text class="muted t-card-h" x="374" y="474">HALVING INTERVAL</text>
  <text class="ink t-card-v" x="374" y="502">1,680,000 → 5,040,000</text>
  <text class="muted t-card-n" x="374" y="522">blocks</text>
  <line class="rule" x1="374" y1="538" x2="626" y2="538" stroke-width="1"/>
  <text class="muted t-card-n" x="374" y="560">1,680,000 × 75s = 126,000,000 s</text>
  <text class="muted t-card-n" x="374" y="578">5,040,000 × 25s = 126,000,000 s</text>
  <text class="muted t-card-n" x="374" y="596">Halving dates do not move.</text>

  <!-- Card 3: supply cap -->
  <rect class="card" x="668" y="448" width="292" height="162" rx="8" stroke-width="1"/>
  <text class="muted t-card-h" x="688" y="474">SUPPLY CAP</text>
  <text class="ink t-card-v" x="688" y="502">21,000,000 ZEC</text>
  <text class="muted t-card-n" x="688" y="522">unchanged</text>
  <line class="rule" x1="688" y1="538" x2="940" y2="538" stroke-width="1"/>
  <text class="muted t-card-n" x="688" y="560">Also unchanged: the 2 MB block</text>
  <text class="muted t-card-n" x="688" y="578">size limit, transparent transactions,</text>
  <text class="muted t-card-n" x="688" y="596">and coinbase maturity at 100 blocks.</text>

  <!-- Footnote -->
  <text class="muted t-foot" x="40" y="634">Subsidy figures are for the current halving era. Each block rounds down by a third of a zatoshi, about 0.0168 ZEC over a full halving interval.</text>
  <text class="muted t-foot" x="40" y="650">The post-NU7 subsidy is 0.52083333 ZEC (52,083,333 zatoshi), not the 0.26041666 ZEC printed in the draft ZIP's explanatory note, which double-counts</text>
  <text class="muted t-foot" x="40" y="666">the Blossom factor — at that figure daily issuance would fall to 900 ZEC. Recorded in Zebra issue #11463. Sources: ZIP 218, ZIP 208.</text>
</svg>
