name: Curation check

# Every English page is either translated (translation/curated-pages.txt) or
# English-only by decision (translation/english-only-pages.txt), and the PR that
# adds, moves or deletes a page records which. This job tells the PR's author,
# in one comment that updates itself, exactly what to change — and fails until
# it is done.
#
# Why the author, in the same PR: the alternative was a maintainer noticing
# later, and nobody did. #2259 and #2297 deleted curated pages and left them in
# curated-pages.txt; check-invariants failed on those PRs, they were merged
# anyway, and every translation sync was blocked until a cleanup PR (#2263,
# #2303). New pages sat uncurated, served in English, until someone remembered.
#
#   adds a page            -> add it to curated-pages.txt (the default), or to
#                             english-only-pages.txt if it should stay English
#   deletes or moves away  -> node translation/decurate.mjs <old path>, which
#   a curated page            removes the line, the 18 translations and their
#                             manifest entries
#   either                 -> node translation/gen-menu-titles.mjs, so the
#                             menu-titles manifests match (menu-titles-fresh)
#
# SECURITY — why pull_request_target, and why it is safe here:
# Most PRs to this repo come from forks, and a plain `pull_request` trigger gets
# a read-only token for those, so it cannot comment. pull_request_target runs
# with the base repo's token, which is only safe if PR code never executes. This
# workflow therefore:
#   * checks out nothing from the PR (no `ref:` override, no PR checkout at all),
#   * runs no build, no install, no script from the PR,
#   * reads the PR only as DATA through the API — the file list, and the text of
#     the two curation lists at the head sha.
# Do not add a checkout of the PR head or any step that runs PR-authored code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "site/**/*.md"
      - "translation/curated-pages.txt"
      - "translation/english-only-pages.txt"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: uncurated-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- uncurated-page-advisory -->';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            // English pages only; zechubglobal/** is hand-maintained per-language
            // content outside the curated corpus (the detector excludes it too).
            const page = (f) => f && f.startsWith('site/') && f.endsWith('.md') && !f.startsWith('site/zechubglobal/');
            const rel = (f) => f.slice('site/'.length);
            // New paths: 'renamed' and 'copied' introduce a page just as 'added' does.
            const added = files.filter((f) => ['added', 'renamed', 'copied'].includes(f.status) && page(f.filename)).map((f) => rel(f.filename));
            // Old paths that no longer exist: deletions, and the source of a rename.
            const gone = [
              ...files.filter((f) => f.status === 'removed' && page(f.filename)).map((f) => rel(f.filename)),
              ...files.filter((f) => f.status === 'renamed' && page(f.previous_filename)).map((f) => rel(f.previous_filename)),
            ];

            // The lists AT THE PR HEAD — what the PR will leave behind — read as
            // data. A list that cannot be read at head falls back to base.
            const list = async (path) => {
              const parse = (t) => new Set(t.split('\n').map((l) => l.replace(/#.*/, '').trim()).filter(Boolean));
              // head.repo is null when the fork was deleted: read base only
              const sources = [
                ...(pr.head.repo ? [[pr.head.repo.owner.login, pr.head.repo.name, pr.head.sha]] : []),
                [owner, repo, pr.base.sha],
              ];
              for (const [o, r, ref] of sources) {
                try {
                  const res = await github.rest.repos.getContent({ owner: o, repo: r, path, ref });
                  return parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
                } catch (e) { core.info(`could not read ${path} at ${ref} (${e.status || e.message})`); }
              }
              return new Set();
            };
            const curated = await list('translation/curated-pages.txt');
            const englishOnly = await list('translation/english-only-pages.txt');

            const undecided = added.filter((p) => !curated.has(p) && !englishOnly.has(p)).sort();
            // a deleted/moved page must leave BOTH lists
            const stillCurated = gone.filter((p) => curated.has(p) || englishOnly.has(p)).sort();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            // Match on the marker AND on authorship, so nobody can plant a comment
            // with the marker and have this job edit it.
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker) &&
              c.user && c.user.type === 'Bot' && c.user.login.startsWith('github-actions'));

            if (!undecided.length && !stillCurated.length) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${marker}\n✅ Translation lists are up to date for this PR — thank you.`,
                });
              }
              core.info('nothing outstanding');
              return;
            }

            // Backticks in a filename would close the code span and let the rest
            // render as markdown (an @mention in a path would ping people). These
            // are attacker-controlled strings rendered into a comment.
            const safe = (t) => String(t).replace(/`/g, '');
            const bullets = (ps) => ps.map((p) => `- \`${safe(p)}\``).join('\n');
            const body = [marker, '### 🌐 Translation: one more change needed in this PR', ''];
            if (undecided.length) body.push(
              `**New page(s) not yet in a translation list** — add each line to \`translation/curated-pages.txt\` (it will be translated into all 18 languages), or to \`translation/english-only-pages.txt\` if it should stay English only:`,
              '', bullets(undecided), '');
            if (stillCurated.length) body.push(
              '**Deleted or moved page(s) still in a translation list** — run this from the repository root and commit the result (it removes the list line, the 18 translations and their manifest entries; it does not touch the English):',
              '', '```', `node translation/decurate.mjs ${stillCurated.map(safe).join(' ')}`, '```', '');
            body.push(
              'Then refresh the menu titles and commit them too:', '', '```', 'node translation/gen-menu-titles.mjs', '```', '',
              'This check turns green by itself once the lists match the pages. Questions: see the translation section of `CONTRIBUTING.md`.');
            const text = body.join('\n');

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: text });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: text });
            core.setFailed(`${undecided.length} new page(s) need a translation decision; ${stillCurated.length} deleted/moved page(s) are still curated`);
