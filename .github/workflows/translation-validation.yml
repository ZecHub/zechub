name: Validate Translated Content

# Least privilege: these jobs only read the tree.
permissions:
  contents: read

on:
  # Run on every PR (no path filter) so the blocking jobs (manifest-invariants,
  # menu-titles-fresh) always produce a status and can be a REQUIRED check
  # without hanging unrelated PRs at "Expected — waiting for status".
  pull_request:
  push:
    branches: [main]

jobs:
  protected-terms:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin actions to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@v4
        with:
          # Full history so the gate can read source and translations at the
          # base and tell an introduced violation from inherited staleness.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine base ref
        id: base
        # Pass the (attacker-influenceable) ref names through env, never inline
        # into the shell, to avoid command injection via a crafted branch name.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "$EVENT_BEFORE^{commit}" >/dev/null; then
            echo "ref=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
          else
            # A branch-creation push sends the all-zero SHA, and a force-push can
            # leave the previous tip unreachable. Compare against the preceding
            # commit rather than failing the job for a history reason.
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate protected terminology
        # Scoped to what this change did to translations. Inherited staleness
        # (English edited, translations not yet re-synced) is reported as a
        # notice and tracked on the translation staleness dashboard instead of
        # reddening every unrelated PR.
        env:
          BASE_REF_OUT: ${{ steps.base.outputs.ref }}
        run: node scripts/check-protected-terms.mjs --base "$BASE_REF_OUT"

      # Brand spelling on the ENGLISH pages a PR changes. A spelling absent from
      # preserveVerbatim is not protected, so the engines translate it — this is
      # how "Free2z" became "Bure2z" in Swahili. Findings are annotations, so
      # they land on the changed line in the diff rather than in a job log.
      #
      # Scoped to changed files, but each changed file is checked in FULL, so
      # touching a page means bringing that page to canon. That is deliberate:
      # it is what drains the backlog, one page at a time. site/zechubglobal/
      # is excluded — 511 pages nothing routes, holding 73% of the backlog.
      - name: Validate brand spelling on changed English pages
        env:
          BASE_REF_OUT: ${{ steps.base.outputs.ref }}
        run: node scripts/check-brand-spelling.mjs --base "$BASE_REF_OUT"

      # The gate's own regression suite. Its failure mode is silent — the mask
      # latches and findings vanish while the run still exits 0 — so it needs a
      # test that fails loudly when that happens again.
      - name: Brand spelling gate self-test
        run: node scripts/check-brand-spelling.test.mjs

      # Page hygiene on the pages a PR changes: link syntax the reader sees,
      # anchors dropped while the heading still exists, and line endings
      # flipped. All four rules exist because a defect of that shape merged
      # with every check green — a literal ")" in a heading, a URL fragment
      # duplicated into the prose, seven ToC anchors collapsed onto one page,
      # and a CRLF file rewritten as LF. Offline: no URL is fetched here, that
      # is link-health's weekly job.
      #
      # Same scope rule as brand spelling — a touched page is checked in full —
      # but site/zechubglobal/ IS included: the whole corpus holds five
      # findings, so there is no wall of failures, and link rot lives there.
      - name: Validate page hygiene on changed pages
        env:
          BASE_REF_OUT: ${{ steps.base.outputs.ref }}
        run: node scripts/check-page-hygiene.mjs --base "$BASE_REF_OUT"

      - name: Page hygiene gate self-test
        run: node scripts/check-page-hygiene.test.mjs

      # Some translated lines are DATA the wiki parses: the wallet page reads
      # each wallet's fields by their English labels and colours the Ironwood
      # badge by its English status. Translated, the Features list rendered
      # empty and the badge grey in every locale. translation/verbatim-lines.json
      # lists those lines; they must match English exactly.
      - name: Verbatim data lines
        run: node scripts/check-verbatim-lines.mjs

      - name: Verbatim data lines self-test
        run: node scripts/check-verbatim-lines.test.mjs

      # Every venue named on the exchange pages must be a protected term, or
      # a machine engine will translate the BRAND. It did: LetsExchange became
      # "Ẹ jẹ́ kí a pààrọ̀" ("let us exchange") in Yoruba, across 109 headings
      # in five locales, and no gate saw it — a translated brand makes a page
      # less English, not more, and these headings carry no links for the
      # structure gate to miss. The only symptom was the wiki's exchange pages
      # silently falling back to a hardcoded English list, because they build
      # cards by matching `###` headings.
      #
      # Checks the DATA, not a diff, so it costs nothing and holds for pages no
      # PR touched.
      - name: Venue brands are protected
        run: node scripts/check-venue-brands.test.mjs

      # link-health itself is a weekly network sweep and cannot run here, but
      # the part that decides which links get re-probed is pure string work and
      # fails silently when wrong — a regex that matches nothing reports a
      # clean corpus. Cheap to assert, so it is asserted on every PR.
      - name: Link-health parser self-test
        run: node link-health/check-links.test.mjs

  hash-lib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit-test the translation libraries
        # Shell-glob (not a bare dir) so it works on Node 20 and still picks up
        # any future *.test.mjs without editing this workflow.
        run: node --test translation/lib/*.test.mjs

  menu-titles-fresh:
    # Freshness gate: the menu-titles manifests must match a from-scratch
    # regeneration. This enforces atomicity — localized side-menu labels always
    # land in the same commit as the translations they describe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Menu-titles manifests are up to date
        run: node translation/gen-menu-titles.mjs --check

  manifest-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so change-tracking can read the manifest at the base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine base ref
        id: base
        # Pass the (attacker-influenceable) ref names through env, never inline
        # into the shell, to avoid command injection via a crafted branch name.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Check manifest invariants
        env:
          BASE_REF_OUT: ${{ steps.base.outputs.ref }}
        run: node translation/check-invariants.mjs --base "$BASE_REF_OUT"

  frontmatter-parity:
    # A translated page must declare the same leading YAML block as its English
    # source. One of the shapes this catches — a `---` the source does not have —
    # takes down the GitHub Pages build for the entire site, and did on
    # 2026-08-14; the others corrupt the page silently. The Pages build only runs
    # after a merge, so this is the only place a pull request can be stopped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the check can tell what this change touched from
          # damage it merely inherited.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine base ref
        id: base
        # Only a pull request gets a base. A push to `main` is swept in full:
        # scoping it to the last push would let damage introduced earlier — by a
        # force-push, or by a merge whose own PR predated this job — sit on the
        # branch that Pages builds from, reported by nothing.
        #
        # Pass the (attacker-influenceable) ref name through env, never inline
        # into the shell, to avoid command injection via a crafted branch name.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check front-matter parity
        # On a pull request, blocking only on what this change introduced;
        # anything already broken is printed as a notice. On a push, no --base,
        # so every page is checked.
        env:
          BASE_REF_OUT: ${{ steps.base.outputs.ref }}
        run: |
          if [ -n "$BASE_REF_OUT" ]; then
            node scripts/check-frontmatter.mjs --base "$BASE_REF_OUT"
          else
            node scripts/check-frontmatter.mjs
          fi
