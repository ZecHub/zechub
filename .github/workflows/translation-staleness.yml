name: Translation staleness dashboard

# Deterministic, secretless detection of stale/missing/orphaned translations.
# Compares translation/sync-state.json against the current English sources and
# publishes the result to a pinned "Translation staleness dashboard" issue.
# Reporting only — never edits content, never merges. See translation/README-sync.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**/*.md"
      - "translation/sync-state.json"
      - "translation/curated-pages.txt"
      - "translation/detect-staleness.mjs"
      - "translation/lib/**"
  schedule:
    - cron: "17 6 * * *" # daily safety-net sweep
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: translation-staleness
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the detector can read the prior source at each
          # entry's src_commit and judge safety-severity on the actual delta.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Detect staleness
        run: node translation/detect-staleness.mjs --json staleness.json --markdown staleness.md
      - name: Publish dashboard issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('staleness.md', 'utf8');
            const report = JSON.parse(fs.readFileSync('staleness.json', 'utf8'));
            const marker = '<!-- translation-staleness-dashboard -->';
            const title = '🌐 Translation staleness dashboard';
            const label = 'translation-staleness';
            const { owner, repo } = context.repo;

            // Ensure the tracking label exists.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label, color: '1f6feb',
                  description: 'Auto-maintained translation staleness dashboard',
                });
              } else { throw e; }
            }

            // Find the existing dashboard issue by our marker (label-scoped).
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const dash = existing.find((i) => !i.pull_request && (i.body || '').includes(marker));

            if (dash) {
              await github.rest.issues.update({ owner, repo, issue_number: dash.number, title, body });
              core.info(`Updated dashboard issue #${dash.number}`);
              core.notice(`Translation staleness: stale=${report.totals.stale} missing=${report.totals.missing} orphan=${report.totals.orphan} high-severity=${report.totals.highSeverity}`);
              return;
            }

            const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            core.info(`Created dashboard issue #${created.data.number}`);

            // Best-effort pin (GraphQL). Non-fatal if it fails (e.g. 3-pin cap).
            try {
              await github.graphql(
                `mutation($id:ID!){ pinIssue(input:{issueId:$id}){ issue { number } } }`,
                { id: created.data.node_id },
              );
              core.info('Pinned dashboard issue.');
            } catch (e) {
              core.warning(`Could not pin issue: ${e.message}`);
            }
