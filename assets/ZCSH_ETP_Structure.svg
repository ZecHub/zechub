<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1430" width="960" height="1430" role="img" aria-labelledby="diagTitle diagDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="diagTitle">How the Grayscale Zcash ETF (ZCSH) actually works</title>
  <desc id="diagDesc">A structural diagram of ZCSH. Grayscale, an asset manager, converted its Zcash Trust into an exchange-traded product on NYSE Arca in August 2026. The trust holds real ZEC at Coinbase Custody in transparent wallets. Investors buy shares through a brokerage and receive price exposure only, never holding ZEC or using Zcash shielded addresses.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#7A8794" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#C98A08" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #16212E; }
    .h1     { font-size: 35px; font-weight: 650; letter-spacing: -0.5px; }
    .sub    { font-size: 15px; fill: #7A8794; }
    .heroA  { font-size: 27px; font-weight: 650; letter-spacing: -0.3px; }
    .heroB  { font-size: 27px; font-weight: 400; fill: #46586B; letter-spacing: -0.3px; }
    .heroS  { font-size: 14.5px; fill: #46586B; }
    .sect   { font-size: 18px; font-weight: 650; }
    .date   { font-size: 13px; font-weight: 650; fill: #35688F; }
    .body   { font-size: 13.5px; fill: #46586B; }
    .role   { font-size: 12.5px; font-weight: 650; fill: #35688F; }
    .ent    { font-size: 14px; fill: #16212E; }
    .entsm  { font-size: 12.5px; fill: #7A8794; }
    .boxh   { font-size: 19px; font-weight: 650; }
    .boxs   { font-size: 13.5px; fill: #46586B; }
    .num    { font-size: 26px; font-weight: 650; }
    .numl   { font-size: 12.5px; fill: #7A8794; }
    .flowl  { font-size: 13px; fill: #46586B; }
    .note   { font-size: 14px; fill: #16212E; }
    .foot   { font-size: 11.5px; fill: #7A8794; }
    .card   { fill: #FFFFFF; stroke: #DFE4E8; stroke-width: 1; }
  </style>

  <rect width="960" height="1430" fill="#FCFCFA"/>

  <!-- ─────────── Header ─────────── -->
  <text class="h1" x="56" y="92">How the Grayscale Zcash ETF (ZCSH) actually works</text>
  <text class="sub" x="56" y="121">Structure as of the NYSE Arca listing, 25 August 2026</text>
  <line x1="56" y1="148" x2="904" y2="148" stroke="#DFE4E8" stroke-width="1"/>

  <!-- ─────────── Hero statement ─────────── -->
  <text class="heroA" x="56" y="207">Zcash did not launch an ETF.</text>
  <text class="heroB" x="56" y="244">Grayscale did — by converting a fund it has run since 2017.</text>
  <text class="heroS" x="56" y="279">Zcash is a protocol. It has no company, treasury or board that could issue a fund. Grayscale is an</text>
  <text class="heroS" x="56" y="299">independent asset manager that buys ZEC on the open market like anyone else.</text>

  <line x1="56" y1="332" x2="904" y2="332" stroke="#DFE4E8" stroke-width="1"/>

  <!-- ─────────── Conversion timeline ─────────── -->
  <text class="sect" x="56" y="378">The same fund, three stages</text>

  <rect class="card" x="56"  y="400" width="261" height="108" rx="6"/>
  <text class="date" x="76"  y="430">October 2017</text>
  <text class="body" x="76"  y="456">Launches as a private</text>
  <text class="body" x="76"  y="475">placement. Accredited</text>
  <text class="body" x="76"  y="494">investors only.</text>

  <line x1="325" y1="454" x2="341" y2="454" stroke="#7A8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect class="card" x="349" y="400" width="261" height="108" rx="6"/>
  <text class="date" x="369" y="430">October 2021</text>
  <text class="body" x="369" y="456">Shares quoted on OTCQX</text>
  <text class="body" x="369" y="475">under the ticker ZCSH.</text>
  <text class="body" x="369" y="494">Traded at a discount to NAV.</text>

  <line x1="618" y1="454" x2="634" y2="454" stroke="#7A8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect class="card" x="642" y="400" width="262" height="108" rx="6"/>
  <text class="date" x="662" y="430">25 August 2026</text>
  <text class="body" x="662" y="456">Becomes a redeemable ETP</text>
  <text class="body" x="662" y="475">on NYSE Arca. Drops the</text>
  <text class="body" x="662" y="494">&#8220;Trust&#8221; name.</text>

  <!-- ─────────── Who does what ─────────── -->
  <text class="sect" x="56" y="566">Who does what</text>

  <rect x="56" y="588" width="848" height="82" rx="6" fill="#F2F5F8" stroke="#D3DCE4" stroke-width="1"/>
  <text class="boxh" x="80" y="622">Zcash ETF (ZCSH)</text>
  <text class="boxs" x="80" y="646">A trust that owns ZEC. Investors own shares in the trust, not the ZEC itself.</text>

  <!-- role grid, row 1 -->
  <rect class="card" x="56"  y="692" width="266" height="92" rx="6"/>
  <text class="role" x="76"  y="720">Sponsor</text>
  <text class="ent"  x="76"  y="744">Grayscale Investments</text>
  <text class="ent"  x="76"  y="763">Sponsors, LLC</text>

  <rect class="card" x="346" y="692" width="266" height="92" rx="6"/>
  <text class="role" x="366" y="720">Trustee</text>
  <text class="ent"  x="366" y="744">CSC Delaware Trust</text>
  <text class="ent"  x="366" y="763">Company</text>

  <rect class="card" x="636" y="692" width="268" height="92" rx="6"/>
  <text class="role" x="656" y="720">Administrator &amp; transfer agent</text>
  <text class="ent"  x="656" y="744">The Bank of New York</text>
  <text class="ent"  x="656" y="763">Mellon</text>

  <!-- role grid, row 2 -->
  <rect class="card" x="56"  y="796" width="266" height="92" rx="6"/>
  <text class="role" x="76"  y="824">Prime broker</text>
  <text class="ent"  x="76"  y="848">Coinbase, Inc.</text>
  <text class="entsm" x="76" y="870">Sources ZEC for the trust</text>

  <rect class="card" x="346" y="796" width="266" height="92" rx="6"/>
  <text class="role" x="366" y="824">Authorised participants</text>
  <text class="ent"  x="366" y="848">Jane Street, Virtu</text>
  <text class="entsm" x="366" y="870">Create and redeem shares</text>

  <rect class="card" x="636" y="796" width="268" height="92" rx="6"/>
  <text class="role" x="656" y="824">Marketing agent</text>
  <text class="ent"  x="656" y="848">Foreside Fund Services</text>

  <!-- custody band — the only place real ZEC sits -->
  <rect x="56" y="908" width="848" height="104" rx="6" fill="#FFFBF0" stroke="#EBD9A8" stroke-width="1"/>
  <rect x="56" y="908" width="5" height="104" rx="2.5" fill="#F4B728"/>
  <text class="role" x="80" y="940" style="fill:#9A6B05">Custodian — the only place actual ZEC exists</text>
  <text class="ent"  x="80" y="966">Coinbase Custody Trust Company, LLC</text>
  <text class="entsm" x="80" y="990">Holds roughly 387,000 ZEC in transparent wallets. Nothing in this fund uses a shielded address.</text>

  <!-- ─────────── What an investor actually gets ─────────── -->
  <text class="sect" x="56" y="1068">What an investor actually gets</text>

  <rect class="card" x="56" y="1090" width="190" height="66" rx="6"/>
  <text class="ent" x="76" y="1122">You</text>
  <text class="entsm" x="76" y="1142">Ordinary brokerage account</text>

  <line x1="254" y1="1123" x2="278" y2="1123" stroke="#7A8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect class="card" x="286" y="1090" width="190" height="66" rx="6"/>
  <text class="ent" x="306" y="1122">ZCSH shares</text>
  <text class="entsm" x="306" y="1142">Bought on NYSE Arca</text>

  <line x1="484" y1="1123" x2="508" y2="1123" stroke="#7A8794" stroke-width="1.4" marker-end="url(#arw)"/>

  <rect x="516" y="1090" width="190" height="66" rx="6" fill="#F2F5F8" stroke="#D3DCE4" stroke-width="1"/>
  <text class="ent" x="536" y="1122">Price exposure to ZEC</text>
  <text class="entsm" x="536" y="1142">Minus a 2.5% annual fee</text>

  <line x1="714" y1="1123" x2="738" y2="1123" stroke="#C98A08" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arwGold)"/>

  <rect x="746" y="1090" width="158" height="66" rx="6" fill="#FFFBF0" stroke="#EBD9A8" stroke-width="1"/>
  <text class="ent" x="766" y="1116" style="fill:#9A6B05">The chain stops here</text>
  <text class="entsm" x="766" y="1136">No ZEC, no keys,</text>
  <text class="entsm" x="766" y="1150">no shielded addresses</text>

  <!-- ─────────── Key numbers ─────────── -->
  <line x1="56" y1="1200" x2="904" y2="1200" stroke="#DFE4E8" stroke-width="1"/>

  <text class="num"  x="56"  y="1248">387,000</text>
  <text class="numl" x="56"  y="1270">ZEC held at launch</text>

  <text class="num"  x="290" y="1248">$313m</text>
  <text class="numl" x="290" y="1270">Assets under management at launch</text>

  <text class="num"  x="650" y="1248">2.5%</text>
  <text class="numl" x="650" y="1270">Annual sponsor fee</text>

  <line x1="56" y1="1300" x2="904" y2="1300" stroke="#DFE4E8" stroke-width="1"/>

  <!-- ─────────── Closing note ─────────── -->
  <text class="note" x="56" y="1336">Grayscale has said early revenue from the sponsor fee will be directed back into Zcash ecosystem</text>
  <text class="note" x="56" y="1358">development. The fee is roughly ten times that of a typical spot bitcoin ETF.</text>

  <text class="foot" x="56" y="1400">Sources: Grayscale Form S-3 registration statement (SEC EDGAR); NYSE Arca listing, 25 August 2026; Grayscale launch statements.</text>
  <text class="foot" x="56" y="1416">Figures are as at launch and will drift. ZecHub — educational use only, not investment advice.</text>
</svg>
